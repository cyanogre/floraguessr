<script>
/* ===== Configuración ===== */
const R_KM=75,MIN_REC=3,ROUNDS=5,PACK=6,TEMPO=74;
const TIERS=[[300000,"Común",1,"#9aa7b4"],[100000,"Poco común",1.5,"#3fd17f"],[40000,"Rara",2.5,"#4b9bff"],[15000,"Épica",4,"#b967ff"],[0,"Legendaria",7,"#ffb72b"]];
const COLORS=["#ff5470","#4be38a","#5b8cff","#ff9a3c","#c26bff","#26d7e0"];
const IUCN={LC:"#4caf50",NT:"#9acd32",VU:"#ffb300",EN:"#fb8c00",CR:"#e53935",EW:"#8e24aa",EX:"#222"};
const SPECIES=[["Pinus sylvestris","Conífera"],["Picea abies","Conífera"],["Sequoia sempervirens","Conífera"],["Araucaria araucana","Conífera"],["Juniperus communis","Conífera"],["Taxus baccata","Conífera"],["Pinus ponderosa","Conífera"],["Pseudotsuga menziesii","Conífera"],
["Quercus robur","Fagal"],["Fagus sylvatica","Fagal"],["Quercus ilex","Fagal"],["Quercus rubra","Fagal"],["Betula pendula","Fagal"],["Acer saccharum","Sapindal"],["Eucalyptus globulus","Mirtal"],["Olea europaea","Olivo"],["Ceratonia siliqua","Leguminosa"],["Robinia pseudoacacia","Leguminosa"],
["Phoenix dactylifera","Palmera"],["Chamaerops humilis","Palmera"],["Sabal palmetto","Palmera"],["Ophrys apifera","Orquídea"],["Orchis mascula","Orquídea"],["Cypripedium calceolus","Orquídea"],
["Phragmites australis","Gramínea"],["Ammophila arenaria","Gramínea"],["Pteridium aquilinum","Helecho"],["Dryopteris filix-mas","Helecho"],["Equisetum arvense","Equiseto"],["Lycopodium clavatum","Licófito"],
["Polytrichum commune","Musgo"],["Sphagnum palustre","Musgo"],["Marchantia polymorpha","Hepática"],["Opuntia ficus-indica","Cactus"],["Carnegiea gigantea","Cactus"],["Agave americana","Agave"],
["Calluna vulgaris","Ericácea"],["Vaccinium myrtillus","Ericácea"],["Taraxacum officinale","Asterácea"],["Nymphaea alba","Ninfeácea"],["Drosera rotundifolia","Carnívora"],["Sarracenia purpurea","Carnívora"],["Ginkgo biloba","Ginkgo"],["Cycas revoluta","Cícada"],["Banksia serrata","Proteácea"],["Protea cynaroides","Proteácea"],["Adansonia digitata","Baobab"]];

/* ===== Escalas por continente (generalizaciones de la etnomusicología; el contexto cultural real es mucho más variado) ===== */
function scaleFor(cont,la,lo){
 const S=(n,iv,root,dr)=>({n,iv,root,dr});
 switch(cont){
  case"EUROPE":return S("Europa · modo dórico (folk modal)",[0,2,3,5,7,9,10],50);
  case"AFRICA":return S("África · pentatónica suspendida (egipcia)",[0,2,5,7,10],52);
  case"NORTH_AMERICA":return S("Norteamérica · escala de blues",[0,3,5,6,7,10],55);
  case"SOUTH_AMERICA":return S("Sudamérica · pentatónica andina menor",[0,3,5,7,10],57);
  case"OCEANIA":return S("Oceanía · pentatónica mayor con bordón",[0,2,4,7,9],52,1);
  case"ANTARCTICA":return S("Antártida · tonos enteros (hielo)",[0,2,4,6,8,10],50,1);
  default:
   if(lo<60)return S("Asia occidental · maqam hiyaz",[0,1,4,5,7,8,10],50,1);
   if(lo<95&&la<38)return S("Asia meridional · raga Yaman con bordón",[0,2,4,6,7,9,11],50,1);
   if(la<22)return S("Sudeste asiático · pelog (gamelán)",[0,1,3,7,8],52);
   if(lo>128)return S("Asia oriental · hirajoshi (Japón)",[0,2,3,7,8],50);
   return S("Asia oriental · pentatónica china (gong)",[0,2,4,7,9],50);
 }}
function contFallback(la,lo){if(la<-60)return"ANTARCTICA";if(lo<-30)return la>12?"NORTH_AMERICA":"SOUTH_AMERICA";if(lo>110&&la<-8||lo>150)return"OCEANIA";if(lo<45&&la>36)return"EUROPE";if(lo<55&&la<36&&lo>-20)return"AFRICA";return"ASIA"}

/* ===== Motor de audio procedural ===== */
const mtof=m=>440*2**((m-69)/12);
const A={c:null,on:true,sc:scaleFor("EUROPE",0,0),root:50,i:0,t:0,md:4,
 start(){if(this.c){this.c.resume();return}const c=this.c=new AudioContext();
  const cp=c.createDynamicsCompressor(),m=this.m=c.createGain();m.gain.value=this.on?.55:0;m.connect(cp);cp.connect(c.destination);
  const L=c.sampleRate*3,b=c.createBuffer(2,L,c.sampleRate);for(let h=0;h<2;h++){const d=b.getChannelData(h);for(let i=0;i<L;i++)d[i]=(Math.random()*2-1)*(1-i/L)**2.6}
  const rv=c.createConvolver();rv.buffer=b;const w=c.createGain();w.gain.value=.7;rv.connect(w);w.connect(m);
  const dl=c.createDelay(1);dl.delayTime.value=60/TEMPO*.75;const fb=c.createGain();fb.gain.value=.36;dl.connect(fb);fb.connect(dl);dl.connect(rv);
  const fx=this.fx=c.createGain();fx.connect(rv);fx.connect(dl);
  const nb=this.nb=c.createBuffer(1,c.sampleRate,c.sampleRate),d=nb.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  this.t=c.currentTime+.2;setInterval(()=>this.sched(),100)},
 nt(ty,f,t,d,g,a=.01,sd=.4,lp=0,dt=0){const c=this.c,o=c.createOscillator(),e=c.createGain();o.type=ty;o.frequency.value=f;o.detune.value=dt;let n=o;
  if(lp){const l=c.createBiquadFilter();l.type="lowpass";l.frequency.value=lp;o.connect(l);n=l}
  n.connect(e);e.gain.setValueAtTime(0,t);e.gain.linearRampToValueAtTime(g,t+a);e.gain.exponentialRampToValueAtTime(.0001,t+d);
  e.connect(this.m);const s=c.createGain();s.gain.value=sd;e.connect(s);s.connect(this.fx);o.start(t);o.stop(t+d+.1)},
 noise(t,d,g,ty,f,to){const c=this.c,s=c.createBufferSource(),fl=c.createBiquadFilter(),e=c.createGain();s.buffer=this.nb;fl.type=ty;fl.frequency.setValueAtTime(f,t);if(to)fl.frequency.exponentialRampToValueAtTime(to,t+d);
  e.gain.setValueAtTime(g,t);e.gain.exponentialRampToValueAtTime(.0001,t+d);s.connect(fl);fl.connect(e);e.connect(this.m);if(to)e.connect(this.fx);s.start(t,Math.random()*.5);s.stop(t+d)},
 kick(t){const o=this.c.createOscillator(),e=this.c.createGain();o.frequency.setValueAtTime(130,t);o.frequency.exponentialRampToValueAtTime(42,t+.16);
  e.gain.setValueAtTime(.3,t);e.gain.exponentialRampToValueAtTime(.001,t+.3);o.connect(e);e.connect(this.m);o.start(t);o.stop(t+.35)},
 sched(){const c=this.c;while(this.t<c.currentTime+.4){this.step(this.t,this.i++);this.t+=60/TEMPO/4}},
 step(t,i){const s=i%16,bar=i>>4,sc=this.sc,iv=sc.iv,n=iv.length,r=this.root,T=t+(s%2?.03:0),bl=240/TEMPO;
  const N=d=>r+iv[((d%n)+n)%n]+12*Math.floor(d/n);
  if(s===0){const d=[0,3,4,2][bar%4]%n;this.deg=d;
   [d,d+2,d+4].concat(Math.random()<.5?[d+6]:[]).forEach(k=>[-7,7].forEach(dt=>this.nt("triangle",mtof(N(k)),t,bl+1,.035,1.1,.5,900,dt)));
   if(sc.dr){this.nt("sine",mtof(r-24),t,bl+1.5,.08,1.5,.2);this.nt("sine",mtof(r-17),t,bl+1.5,.04,1.5,.2)}}
  if(s===0||s===10)this.nt("sine",mtof(N(this.deg)-24),T,1.2,.16,.02,.1,400);
  if(s%8===0||(s===14&&Math.random()<.3))this.kick(T);
  if(s%4===2)this.noise(T,.05,.04+Math.random()*.03,"highpass",7000);
  const p=(s%4===0?.5:s%2===0?.28:.1)*((bar%8)>5?.15:1);
  if(Math.random()<p){this.md=Math.max(2,Math.min(n*2+1,this.md+[-2,-1,-1,0,1,1,2][Math.random()*7|0]));
   this.nt("triangle",mtof(N(this.md)+12),T,1.6,.07,.005,.7,2400);this.nt("sine",mtof(N(this.md)+24),T,.8,.02,.005,.8)}},
 set(sc){this.sc=sc;this.root=sc.root;this.md=sc.iv.length},
 sfx(k){const c=this.c;if(!c||!this.on)return;const t=c.currentTime+.02,iv=this.sc.iv,r=this.root+12,F=d=>mtof(r+iv[d%iv.length]+12*Math.floor(d/iv.length));
  if(k==="open"){this.noise(t,.9,.18,"bandpass",300,3500);[0,2,4,7].forEach((d,q)=>this.nt("sine",F(d+iv.length),t+.5+q*.09,1.8,.08,.01,.9))}
  if(k==="pick")this.nt("triangle",F(2),t,.25,.12,.005,.5);
  if(k==="ok")[0,2,4,6].forEach((d,q)=>this.nt("triangle",F(d+iv.length),t+q*.1,1.3,.1,.01,.9));
  if(k==="no")[0,1].forEach(q=>this.nt("sine",mtof(r-12-q*3),t+q*.2,1,.16,.02,.3,500));
  if(k==="tick")this.noise(t,.05,.05,"highpass",4000)},

async function getCard([sci,grp,e]){

  j("https://en.wikipedia.org/api/rest_v1/page/summary/"+enc(sci.replace(/ /g,"_"))),j(G+"species/match?kingdom=Plantae&name="+enc(sci))]);

 let v=null;try{v=(await j(`https://wikimedia.org/api/rest_v1/metrics/pageviews/per-article/en.wikipedia/all-access/user/${enc(title)}/monthly/${a}/${b}`)).items.reduce((q,i)=>q+i.views,0)}catch(e){}

const SCN=`${IN}observations/species_counts?iconic_taxa=Plantae&quality_grade=research&captive=false&locale=es`;

 if(!m.usageKey)throw 0;
 const w=(s.titles&&s.titles.canonical)||t0,d=new Date(),f=n=>String(n).padStart(2,"0"),a=`${d.getFullYear()-1}${f(d.getMonth()+1)}0100`,b=`${d.getFullYear()}${f(d.getMonth()+1)}0100`;
 let v=null;try{v=(await j(`https://wikimedia.org/api/rest_v1/metrics/pageviews/per-article/en.wikipedia/all-access/user/${enc(w)}/monthly/${a}/${b}`)).items.reduce((q,i)=>q+i.views,0)}catch(e){}

async function zonalRound(){
 const W=DIFV;
 for(let a=0;a<8;a++){
  try{let la,lo;
   if(a<4){const r=(await j(`${IN}observations?iconic_taxa=Plantae&quality_grade=research&captive=false&order_by=random&per_page=1&acc_below=2000`)).results[0];
    if(!r||!r.location||r.obscured)continue;[la,lo]=r.location.split(",").map(Number)}
   else{la=Math.random()*120-50;lo=Math.random()*340-170}
   if(Math.abs(la)>78||Math.abs(lo)>172)continue;
   const L=await near(la,lo,R_KM);if(L.filter(usable).length<4)continue;
   let N=await near(la,lo,R_KM,"&native=true").catch(()=>[]);N=N.filter(usable);if(!N.length)N=L.filter(usable);
   const loc=new Set(L.map(x=>x.taxon.id)),good=sh(N).slice(0,2);
   const wd=(await near(la,lo,W,`&page=${1+Math.random()*4|0}`)).filter(usable).filter(x=>!loc.has(x.taxon.id));
   const cand=sh(wd).slice(0,16);if(cand.length<4)continue;

   const g=await j(`${G}occurrence/search?taxonKey=6&limit=1&geometry=${enc(wkt([la,lo]))}`).catch(()=>({results:[]})),o=g.results[0]||{};
   S.loc={p:[la,lo],cont:o.continent||contFallback(la,lo),country:o.country};return}
  catch(e){}}
 throw 0}
